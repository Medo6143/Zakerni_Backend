# Development infrastructure only: PostgreSQL + Redis.
# Django and Celery run on the host (see README.md > Setup).
services:
  db:
    image: postgres:16-alpine
    container_name: zakerni-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zakerni}
      POSTGRES_USER: ${POSTGRES_USER:-zakerni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zakerni}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zakerni} -d ${POSTGRES_DB:-zakerni}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zakerni-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
